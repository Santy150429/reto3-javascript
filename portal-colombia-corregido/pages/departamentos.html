<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departamentos de Colombia | Mini Portal</title>
    <meta name="description" content="Explora los departamentos de Colombia: región, población, superficie y descripción de cada uno, con datos de la API oficial de Colombia.">
    <meta name="theme-color" content="#0b2545">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/utils.js" defer></script>
    <script src="../js/departamentos.js" defer></script>
</head>
<body>
    <header>
        <h1>🗺️ Departamentos de Colombia</h1>
        <nav>
            <a href="../index.html" class="nav-link">⬅ Volver al Inicio</a>
            <a href="sabores.html" class="nav-link">Ir a Sabores de Colombia ➡</a>
        </nav>
    </header>

    <main class="container">
        <section id="stats-container" class="stats-box">
            <h2>Estadísticas Regionales</h2>
            <p id="total-departamentos" class="stats-total"></p>
            <div id="region-stats" class="region-stats-grid"></div>
        </section>

        <h2 class="section-title">Lista de departamentos</h2>

        <div id="loading" class="loading-msg" role="status">
            <div class="spinner" aria-hidden="true"></div>
            <p>Cargando departamentos... por favor espere.</p>
        </div>
        <div id="error-container" class="error-msg" role="alert" hidden></div>

        <section id="departments-grid" class="grid-container" aria-label="Departamentos de Colombia"></section>
    </main>

    <footer>
        <p>Desarrollado para la actividad académica con la API de Colombia.</p>
    </footer>
</body>
</html>
